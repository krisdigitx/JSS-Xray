backend:
  replicaCount: 1
  image:
    repository: krisdigitx/jss-xray-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

frontend:
  replicaCount: 1
  image:
    repository: krisdigitx/jss-xray-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    loadBalancerIP: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

existingSecret: jss-xray-secrets

postgresql:
  image: postgres:17-alpine
  database: amazon_orders
  username: amazon_orders
  persistence:
    size: 10Gi
    storageClass: ""

gmailSync:
  enabled: true
  schedule: "*/30 * * * *"
  maxNewMessages: 50
  backfillMessages: 50
  lookbackHours: 24

amazonAccounts:
  - slug: tauri-royale
    name: Tauri Royale
    secretName: jss-xray-secrets
    schedule: "0,30 * * * *"
  - slug: polaris-zone
    name: Polaris Zone
    secretName: jss-xray-polaris-zone
    schedule: "10,40 * * * *"
  - slug: jss-traders
    name: JSS Traders
    secretName: jss-xray-jss-traders
    schedule: "20,50 * * * *"
