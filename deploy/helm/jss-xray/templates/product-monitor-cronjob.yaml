{{- if .Values.productMonitor.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jss-xray-product-price-monitor-polaris-zone
spec:
  successfulJobsHistoryLimit: {{ .Values.productMonitor.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.productMonitor.failedJobsHistoryLimit }}
  schedule: {{ .Values.productMonitor.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: product-price-monitor
              image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
              imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
              command: ["python", "-m", "app.product_monitor_sync"]
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: POSTGRES_PASSWORD
                - name: DATABASE_URL
                  value: "postgresql+psycopg://{{ .Values.postgresql.username }}:$(POSTGRES_PASSWORD)@jss-xray-postgres:5432/{{ .Values.postgresql.database }}"
                - name: TIKTOK_SHOP_SLUG
                  value: "polaris-zone"
                - name: TIKTOK_SHOP_NAME
                  value: "Polaris Zone"
                - name: TIKTOK_APP_KEY
                  valueFrom: {secretKeyRef: {name: jss-xray-tiktok-polaris-zone, key: TIKTOK_APP_KEY}}
                - name: TIKTOK_APP_SECRET
                  valueFrom: {secretKeyRef: {name: jss-xray-tiktok-polaris-zone, key: TIKTOK_APP_SECRET}}
                - name: TIKTOK_ACCESS_TOKEN
                  valueFrom: {secretKeyRef: {name: jss-xray-tiktok-polaris-zone, key: TIKTOK_ACCESS_TOKEN, optional: true}}
                - name: TIKTOK_REFRESH_TOKEN
                  valueFrom: {secretKeyRef: {name: jss-xray-tiktok-polaris-zone, key: TIKTOK_REFRESH_TOKEN, optional: true}}
                - name: TIKTOK_SHOP_CIPHER
                  valueFrom: {secretKeyRef: {name: jss-xray-tiktok-polaris-zone, key: TIKTOK_SHOP_CIPHER, optional: true}}
{{- end }}
