{{- if .Values.gmailSync.enabled }}
{{- range .Values.amazonAccounts }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jss-xray-gmail-sync-{{ .slug }}
spec:
  schedule: {{ default $.Values.gmailSync.schedule .schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: "{{ $.Values.backend.image.repository }}:{{ $.Values.backend.image.tag }}"
              imagePullPolicy: {{ $.Values.backend.image.pullPolicy }}
              command: ["python", "-m", "app.sync"]
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.existingSecret }}
                      key: POSTGRES_PASSWORD
                - name: DATABASE_URL
                  value: "postgresql+psycopg://{{ $.Values.postgresql.username }}:$(POSTGRES_PASSWORD)@jss-xray-postgres:5432/{{ $.Values.postgresql.database }}"
                - name: ACCOUNT_SLUG
                  value: {{ .slug | quote }}
                - name: ACCOUNT_NAME
                  value: {{ .name | quote }}
                - name: GMAIL_MAX_NEW_MESSAGES
                  value: {{ $.Values.gmailSync.maxNewMessages | quote }}
                - name: GMAIL_BACKFILL_MESSAGES
                  value: {{ $.Values.gmailSync.backfillMessages | quote }}
                - name: GMAIL_LOOKBACK_HOURS
                  value: {{ $.Values.gmailSync.lookbackHours | quote }}
                - name: GMAIL_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .secretName }}
                      key: GMAIL_CLIENT_ID
                - name: GMAIL_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .secretName }}
                      key: GMAIL_CLIENT_SECRET
                - name: GMAIL_REFRESH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .secretName }}
                      key: GMAIL_REFRESH_TOKEN
{{- end }}
{{- end }}
