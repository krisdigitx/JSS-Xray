backend:
  replicaCount: 1
  image:
    repository: krisdigitx/jss-xray-backend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 1
  image:
    repository: krisdigitx/jss-xray-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 80
    loadBalancerIP: 192.168.1.248
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

existingSecret: jss-xray-secrets

migration:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 180

postgresql:
  image: postgres:17-alpine
  database: jss_xray
  username: jss_xray
  persistence:
    size: 10Gi
    storageClass: local-path

gmailSync:
  enabled: true
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  schedule: "*/30 * * * *"
  maxNewMessages: 50
  backfillMessages: 50
  lookbackHours: 24

amazonAccounts:
  - slug: tauri-royale
    name: Tauri Royale
    secretName: jss-xray-secrets
    schedule: "0,30 * * * *"
  - slug: polaris-zone
    name: Polaris Zone
    secretName: jss-xray-polaris-zone
    schedule: "10,40 * * * *"
  - slug: jss-traders
    name: JSS Traders
    secretName: jss-xray-jss-traders
    schedule: "20,50 * * * *"
