apiVersion: v1
kind: Service
metadata:
  name: amazon-orders-backend
spec:
  selector: {app: amazon-orders-backend}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazon-orders-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels: {app: amazon-orders-backend}
  template:
    metadata:
      labels: {app: amazon-orders-backend}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgresql.username }}:$(POSTGRES_PASSWORD)@amazon-orders-postgres:5432/{{ .Values.postgresql.database }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
